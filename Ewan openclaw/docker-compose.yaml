version: "3.8"

services:
  openclaw:
    image: openclaw/openclaw:latest
    container_name: openclaw-finance
    restart: always

    # --- Security hardening ---
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges

    # --- Ports: Web UI only on localhost ---
    ports:
      - "127.0.0.1:18789:18789"

    # --- Volumes ---
    volumes:
      # Named volume for OpenClaw persistent data
      - openclaw-data:/root/.openclaw

      # Mount skill as read-only
      - ./:/root/.openclaw/skills/daily-finance-report:ro

      # Writable tmp (no exec)
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m

    # --- Environment (API keys injected here) ---
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}

    # --- Network isolation ---
    networks:
      - openclaw-net

volumes:
  openclaw-data:

networks:
  openclaw-net:
    driver: bridge

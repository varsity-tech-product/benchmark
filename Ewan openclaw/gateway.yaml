# ============================================================
# OpenClaw Gateway Security Configuration
#
# Principle: minimal attack surface.
# This agent ONLY needs to call its own MCP tools and send
# Telegram messages. Everything else is disabled.
# ============================================================

security:
  # --- Tool policy: disable all dangerous built-in tools ---
  toolPolicy:
    exec:
      enabled: false          # completely disable shell execution
    file_write:
      enabled: false          # no file write access
    file_read:
      allowPaths:
        - /root/.openclaw/skills/daily-finance-report/config/*
    web_fetch:
      enabled: false          # no arbitrary web browsing

  # --- Skill trust management ---
  skills:
    autoInstall: false        # never auto-install from ClawHub
    allowedSources:
      - local                 # only load local skills

  # --- Channel access control ---
  channels:
    telegram:
      allowedUsers:
        - "YOUR_TELEGRAM_USER_ID"   # CHANGE THIS to your real Telegram user ID

# ============================================================
# Docker hardening checklist (applied at container launch):
#
#   --read-only                     container filesystem is immutable
#   --cap-drop=ALL                  drop all Linux capabilities
#   --cap-add=NET_BIND_SERVICE      only allow port binding
#   --security-opt=no-new-privileges  prevent privilege escalation
#   --tmpfs /tmp:rw,noexec,nosuid   writable tmp without exec
#   -p 127.0.0.1:18789:18789       web UI only accessible locally
#
# See docker-compose.yaml for full configuration.
# ============================================================

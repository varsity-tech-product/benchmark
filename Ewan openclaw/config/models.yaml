# ============================================================
# Central LLM model configuration for all call sites.
# To switch a model, change ONE line here — no code changes.
# ============================================================
#
# Authentication priority:
#   1. OAuth direct → Anthropic API (free with Claude Code Max Plan)
#   2. OpenRouter fallback (uses OPENROUTER_API_KEY)
#
# When using OAuth, all models must be Anthropic models.
# When using OpenRouter, any supported model ID works.

provider: openrouter
base_url: "https://openrouter.ai/api/v1"
api_key_env: OPENROUTER_API_KEY

models:
  # All using Haiku for consistent quality + free via OAuth
  technical_analysis:
    model: "anthropic/claude-haiku-4-5"
    temperature: 0.3
    max_tokens: 4000

  news_analysis:
    model: "anthropic/claude-haiku-4-5"
    temperature: 0.3
    max_tokens: 6000

  macro_analysis:
    model: "anthropic/claude-haiku-4-5"
    temperature: 0.3
    max_tokens: 3000

  report:
    model: "anthropic/claude-haiku-4-5"
    temperature: 0.4
    max_tokens: 8000

# Fallback: if OAuth unavailable, these OpenRouter models are used
# (same model IDs work on both OAuth and OpenRouter)
fallback:
  tier1: "anthropic/claude-haiku-4-5"
  tier2: "anthropic/claude-sonnet-4.6"
